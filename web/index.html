<!doctype html>
<html lang="uz">
<head>
<script src="config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#047857">
<script src="theme-init.js"></script>
<title data-i18n="app.title">Masjid xaritasi</title>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preload" as="fetch" href="https://tiles.openfreemap.org/styles/liberty" crossorigin>
<link rel="preload" as="fetch" href="https://tiles.openfreemap.org/planet" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="i18n.js" defer></script>
<script src="vendor/maplibre-gl.js" defer></script>
<script src="prayer.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="tile"><svg viewBox="0 0 100 100">
    <rect class="g ground a1" x="14" y="74" width="72" height="3"/>
    <rect class="g rise a2" x="16" y="52" width="48" height="22"/>
    <path class="g a3" style="transform-origin:50% 100%" d="M16 52A24 26 0 0 1 64 52Z"/>
    <path class="g door a4" d="M35 61A5 5 0 0 1 45 61V74H35Z"/>
    <g class="a5" style="animation:sp-pop .5s cubic-bezier(.34,1.5,.64,1) both;animation-delay:1.2s"><rect class="g" x="39" y="18" width="2" height="9" style="animation:none;opacity:1"/><circle class="g" cx="40" cy="17.8" r="2.8" style="animation:none;opacity:1"/></g>
    <g class="rise a3" style="animation:sp-y .5s cubic-bezier(.34,1.5,.64,1) both;animation-delay:.85s"><rect class="g" x="71" y="40" width="6" height="34" style="animation:none;opacity:1"/><rect class="g" x="68.5" y="45" width="11" height="3" style="animation:none;opacity:1"/></g>
    <g class="a6" style="animation:sp-pop .5s cubic-bezier(.34,1.5,.64,1) both;animation-delay:1.35s"><path class="g" d="M69.5 40L74 27L78.5 40Z" style="animation:none;opacity:1"/><circle class="g" cx="74" cy="24.4" r="1.4" style="animation:none;opacity:1"/></g>
  </svg></div>
</div>
<!-- home page: today's prayer times -->
<main id="home">
  <div class="home-top">
    <div><div id="home-date"></div><div id="home-place"></div></div>
    <button class="more-btn" type="button" data-i18n-aria="menu.more" aria-haspopup="menu"></button>
  </div>
  <section class="glass hero">
    <div class="hero-lab" data-i18n="home.next"></div>
    <div class="hero-row"><span id="hero-name"></span><span id="hero-time"></span></div>
    <div id="hero-left" class="pill"></div>
  </section>
  <section id="home-times" class="glass"></section>
  <div id="home-note"></div>
</main>

<!-- the mosques as a list -->
<section id="list-page">
  <header class="strip"><h1 data-i18n="nav.mosques">Masjidlar</h1><button class="more-btn" type="button" data-i18n-aria="menu.more" aria-haspopup="menu"></button></header>
  <div id="list-hint" hidden></div>
  <div id="list"></div>
  <div id="list-more"></div>
</section>

<header id="prayer" class="strip" role="region" data-i18n-aria="prayer.region">
  <button class="more-btn" type="button" data-i18n-aria="menu.more" aria-haspopup="menu"></button>
</header>

<div id="map"></div>

<div id="search">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <input id="q" type="search" data-i18n-ph="search.ph" autocomplete="off" maxlength="60" enterkeyhint="search">
  <ul id="results" hidden></ul>
</div>

<button id="nearest" class="chip-btn" type="button">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <span data-i18n="nearest.btn">Eng yaqin masjid</span>
</button>

<button id="view-fab" class="fab" type="button">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"></svg>
  <span></span>
</button>

<div id="add-bar" hidden>
  <span id="add-hint"></span>
  <button id="add-cancel" class="btn ghost small" type="button" data-i18n="btn.cancel">Bekor</button>
</div>

<aside id="panel" hidden>
  <div class="grabber" aria-hidden="true"></div>
  <button id="panel-close" class="icon-btn close" data-i18n-aria="btn.close" type="button">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <div id="panel-body"></div>
</aside>

<div id="maperr" role="alert" hidden><span id="maperr-text"></span> <button id="maperr-retry" class="btn small" type="button" data-i18n="btn.retry">Qayta urinish</button></div>
<nav id="nav">
  <button id="nav-home" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg><span data-i18n="nav.home">Bosh sahifa</span></button>
  <button id="nav-mosques" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2c1 1.6 2.6 2.4 2.6 4.4a2.6 2.6 0 0 1-5.2 0C9.4 4.4 11 3.6 12 2zM5 21V12.5a7 7 0 0 1 14 0V21h-4.5v-4a2.5 2.5 0 0 0-5 0v4z"/></svg><span data-i18n="nav.mosques">Masjidlar</span></button>
</nav>
<div id="menu" role="menu" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
