name: CI
# Tests only: lint, tests against an ephemeral PostgreSQL 17, pip-audit, docker build. No push, no deploy, no registry login.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: masjid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/masjid_test   # wiped by the tests: CI only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --require-hashes -r requirements.txt && pip install ruff pip-audit
      - run: ruff check server tests
      - run: python -m unittest discover -s tests -v
      - run: pip-audit -r requirements.txt --require-hashes
  docker:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t masjid-uz:ci .
      - name: image runs as non-root and imports
        run: |
          test "$(docker run --rm --entrypoint id masjid-uz:ci -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp --entrypoint python masjid-uz:ci -c "import sys; sys.path.insert(0,'/app/server'); import app, bot, import_osm, data_import; print('imports ok')"
