name: Docker

# `main` ga push → image Docker Hub'ga push → (ixtiyoriy) serverga deploy.
#
# Secret'lar (har bir repozitoriyda alohida kiritiladi). AWS shart emas: SERVER_* — istalgan VPS'ga SSH:
#   DOCKERHUB_USERNAME, DOCKERHUB_ACCESS_TOKEN        (image'ni Docker Hub'ga yuborish)
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY          (serverga chiqarish; faqat DEPLOY_ENABLED=true bo'lganda)
#
# Deploy'ni yoqish uchun: Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED = true

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: masjid-uz
  PLATFORMS: linux/amd64     # ARM VPS uchun: linux/arm64

jobs:
  build:
    name: Build va push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sir skaneri
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Image nomini aniqlash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret'i yo'q. Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "IMAGE=${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: QEMU (boshqa arxitektura uchun)
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub'ga kirish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Teg va label'lar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Qurish va push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Xulosa
        run: |
          echo "### Image tayyor" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Serverga chiqarish
    needs: build
    # Faqat main branch'da va faqat qo'lda yoqilganda.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Image tegini aniqlash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "IMAGE=${DOCKERHUB_USERNAME}/${IMAGE_NAME}:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: ${{ vars.DEPLOY_PATH || 'masjid-uz' }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" \
            "APP_DIR='$APP_DIR' IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          export IMAGE
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          echo "→ yangi image: $IMAGE"
          $COMPOSE pull
          # --no-build: serverda hech qachon build bo'lmasin.
          $COMPOSE up -d --no-build --remove-orphans

          # Health tekshiruvi: web konteyneri ichidan
          ok=0
          for i in $(seq 1 30); do
            if $COMPOSE exec -T web curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "✗ web sog'lom javob bermadi — oxirgi loglar:"
            $COMPOSE logs --tail=60 web
            exit 1
          fi
          echo "✓ web sog'lom"

          docker image prune -f >/dev/null
          $COMPOSE ps
          REMOTE
